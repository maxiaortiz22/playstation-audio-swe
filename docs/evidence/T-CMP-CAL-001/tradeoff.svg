<svg xmlns="http://www.w3.org/2000/svg" width="760" height="400" viewBox="0 0 760 400" role="img" aria-labelledby="title desc">
<title id="title">T-CMP-CAL-001 candidate tradeoff</title>
<desc id="desc">False-valid versus unique-case rejection counts for calibration and holdout.</desc>
<rect width="760" height="400" fill="white"/>
<line x1="70" y1="310" x2="470" y2="310" stroke="#222"/>
<line x1="70" y1="50" x2="70" y2="310" stroke="#222"/>
<text x="270" y="365" text-anchor="middle" font-family="sans-serif" font-size="13">false-valid (includes wrong-lag valid)</text>
<text x="18" y="180" text-anchor="middle" transform="rotate(-90 18 180)" font-family="sans-serif" font-size="13">unique rejected (ambiguous + invalid)</text>
<line x1="70.00" y1="310" x2="70.00" y2="315" stroke="#222"/>
<text x="70.00" y="330" text-anchor="middle" font-family="sans-serif" font-size="11">0</text>
<line x1="470.00" y1="310" x2="470.00" y2="315" stroke="#222"/>
<text x="470.00" y="330" text-anchor="middle" font-family="sans-serif" font-size="11">1</text>
<line x1="65" y1="310.00" x2="70" y2="310.00" stroke="#222"/>
<text x="60" y="314.00" text-anchor="end" font-family="sans-serif" font-size="11">0</text>
<line x1="65" y1="180.00" x2="70" y2="180.00" stroke="#222"/>
<text x="60" y="184.00" text-anchor="end" font-family="sans-serif" font-size="11">1</text>
<line x1="65" y1="50.00" x2="70" y2="50.00" stroke="#222"/>
<text x="60" y="54.00" text-anchor="end" font-family="sans-serif" font-size="11">2</text>
<circle cx="70.00" cy="172.00" r="8" fill="#2f6fbb" stroke="white" stroke-width="1"/>
<text x="70.00" y="176.00" text-anchor="middle" font-family="sans-serif" font-size="10" font-weight="bold" fill="white">A</text>
<circle cx="477.00" cy="302.00" r="8" fill="#d95f02" stroke="white" stroke-width="1"/>
<text x="477.00" y="306.00" text-anchor="middle" font-family="sans-serif" font-size="10" font-weight="bold" fill="white">A</text>
<circle cx="70.00" cy="180.00" r="8" fill="#2f6fbb" stroke="white" stroke-width="1"/>
<text x="70.00" y="184.00" text-anchor="middle" font-family="sans-serif" font-size="10" font-weight="bold" fill="white">B</text>
<circle cx="77.00" cy="180.00" r="8" fill="#d95f02" stroke="white" stroke-width="1"/>
<text x="77.00" y="184.00" text-anchor="middle" font-family="sans-serif" font-size="10" font-weight="bold" fill="white">B</text>
<circle cx="70.00" cy="58.00" r="8" fill="#2f6fbb" stroke="white" stroke-width="1"/>
<text x="70.00" y="62.00" text-anchor="middle" font-family="sans-serif" font-size="10" font-weight="bold" fill="white">C</text>
<circle cx="77.00" cy="58.00" r="8" fill="#d95f02" stroke="white" stroke-width="1"/>
<text x="77.00" y="62.00" text-anchor="middle" font-family="sans-serif" font-size="10" font-weight="bold" fill="white">C</text>
<text x="505" y="46" font-family="sans-serif" font-size="13" font-weight="bold">Legend: candidate / split</text>
<text x="505" y="64" font-family="sans-serif" font-size="11">values = false-valid, unique rejected</text>
<rect x="505" y="76" width="12" height="12" fill="#2f6fbb"/><text x="523" y="87" font-family="sans-serif" font-size="11">calibration</text>
<rect x="610" y="76" width="12" height="12" fill="#d95f02"/><text x="628" y="87" font-family="sans-serif" font-size="11">holdout</text>
<text x="505" y="122" font-family="sans-serif" font-size="12" font-weight="bold">A — OP-A-permissive</text>
<text x="523" y="142" font-family="sans-serif" font-size="11">calibration: 0, 1</text>
<text x="523" y="160" font-family="sans-serif" font-size="11">holdout: 1, 0</text>
<text x="505" y="194" font-family="sans-serif" font-size="12" font-weight="bold">B — OP-B-intermediate</text>
<text x="523" y="214" font-family="sans-serif" font-size="11">calibration: 0, 1</text>
<text x="523" y="232" font-family="sans-serif" font-size="11">holdout: 0, 1</text>
<text x="505" y="266" font-family="sans-serif" font-size="12" font-weight="bold">C — OP-C-conservative</text>
<text x="523" y="286" font-family="sans-serif" font-size="11">calibration: 0, 2</text>
<text x="523" y="304" font-family="sans-serif" font-size="11">holdout: 0, 2</text>
</svg>
